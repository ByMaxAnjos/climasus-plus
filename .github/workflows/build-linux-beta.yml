name: build-linux-beta

# DRAFT — Linux beta build for climasus+. Runs entirely on an ubuntu-latest runner, mirroring
# build-windows-beta.yml. Trigger manually from the Actions tab. Expect the R-install step to
# need iteration on the first runs (INLA + the geospatial packages are the usual failure points,
# same as the Windows workflow's history).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also create/update a GitHub pre-release with the installers"
        type: boolean
        default: false
      tag:
        description: "Release tag (only used when publish=true)"
        default: "v0.1.0-beta-linux"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # matches the R version the macOS/Windows bundles were built against (R 4.5.1)
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.1"
          use-public-rspm: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri + geospatial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libcurl4-openssl-dev libxml2-dev libgdal-dev libgeos-dev libproj-dev \
            libudunits2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R package closure (complete, explicit)
        shell: Rscript {0}
        run: |
          options(timeout = 600)
          install.packages("pak")
          source("scripts/r-packages.R")
          # INLA lives in its own repo and isn't on the public RSPM binary mirror — install it
          # the documented way, with base install.packages and the INLA repo passed explicitly.
          # dep=TRUE pulls INLA's hard deps (Matrix, sp, fmesher) too.
          inla_repo <- "https://inla.r-inla-download.org/R/stable"
          for (attempt in 1:3) {
            try(install.packages("INLA", repos = c(getOption("repos"), INLA = inla_repo), dep = TRUE))
            if ("INLA" %in% rownames(installed.packages())) break
            message("INLA install attempt ", attempt, " failed; retrying in 10s...")
            Sys.sleep(10)
          }
          if (!("INLA" %in% rownames(installed.packages()))) stop("INLA could not be installed from ", inla_repo)
          # Everything else via pak: GitHub-only packages by "owner/repo" ref, the rest by name.
          cran_pkgs <- setdiff(CLIMASUS_USED, c(CLIMASUS_BASE_PKGS, names(CLIMASUS_GITHUB_PKGS), "INLA"))
          pak::pak(c(unname(CLIMASUS_GITHUB_PKGS), cran_pkgs, "rmarkdown"))
          need <- setdiff(CLIMASUS_USED, rownames(installed.packages()))
          if (length(need)) stop("Missing after install: ", paste(need, collapse = ", "))
          cat("All", length(CLIMASUS_USED), "required packages present.\n")

      - name: Install JS deps
        run: npm ci

      # NOTE: beforeBuildCommand ("npm run build") runs `tsc -b` first, same gate the Windows
      # workflow relies on.
      - name: Bundle R into resources/
        run: |
          Rscript scripts/bundle-r-linux.R
          bash scripts/bundle-r-relocate-linux.sh

      - name: Allow unprivileged user namespaces (AppImage runtime needs this on 24.04)
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor by default, which
        # breaks the sandboxed extraction linuxdeploy's bundled AppImage runtime uses even in
        # extract-and-run mode — it fails silently ("failed to run linuxdeploy", no detail).
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Tauri build (deb + AppImage)
        # linuxdeploy/linuxdeploy-plugin-appimage are themselves AppImages, which need FUSE to
        # mount — ubuntu-latest (24.04) doesn't ship libfuse2 by default. Force extract-and-run
        # instead of fighting the libfuse2/libfuse2t64 rename across Ubuntu versions.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx -y @tauri-apps/cli@^2 build --bundles deb,appimage

      - name: Compute checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: climasus-plus-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS-linux.txt
          if-no-files-found: error

      - name: Publish pre-release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle
          deb=$(ls deb/*.deb | head -1)
          appimage=$(ls appimage/*.AppImage | head -1)
          # re-running against an existing tag updates that release's assets instead of failing
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" \
              "$deb" "$appimage" "SHA256SUMS-linux.txt" --clobber
          else
            gh release create "${{ inputs.tag }}" \
              --title "climasus+ ${{ inputs.tag }}" \
              --prerelease \
              --notes "Beta Linux do climasus+ (build de CI). Instaladores .deb e .AppImage gerados automaticamente." \
              "$deb" "$appimage" "SHA256SUMS-linux.txt"
          fi
