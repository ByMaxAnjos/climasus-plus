<svg viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Como sus_climate_aggregate junta saúde, clima e território</title>
  <desc id="desc">Diagrama didático do livro ClimaSUS+ Studio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:800;fill:#0f172a}
      .subtitle{font-size:15px;fill:#475569}
      .section{font-size:17px;font-weight:800;fill:#0f172a}
      .label{font-size:15px;font-weight:750;fill:#0f172a}
      .small{font-size:13px;fill:#475569}
      .tiny{font-size:11px;fill:#475569}
      .mono{font-size:11px;fill:#4338ca;font-family:"IBM Plex Mono","SF Mono",monospace}
      .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5;filter:url(#shadow)}
      .note{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="450" rx="18" fill="#f8fafc"/>
<text x="32" y="42" class="title" >Etapa Integração: uma linha do tempo comum</text>
  <text x="32" y="68" class="subtitle" >A pergunta científica só fica modelável quando saúde, clima e território compartilham unidade temporal e espacial.</text>
  <rect x="58" y="120" width="250" height="86" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="78" cy="140" r="13" fill="#4338ca"/>
  <text x="78" y="145" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">A</text>
  <text x="183" y="148" class="label" text-anchor="middle">Saúde</text>
  <text x="183" y="172" class="small" text-anchor="middle">série preparada</text>
  <text x="183" y="189" class="small" text-anchor="middle">contagens por tempo/município</text>
  <rect x="58" y="230" width="250" height="98" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="78" cy="250" r="13" fill="#0369a1"/>
  <text x="78" y="255" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">B</text>
  <text x="183" y="258" class="label" text-anchor="middle">Clima</text>
  <text x="183" y="282" class="small" text-anchor="middle">estação INMET ou grade</text>
  <text x="183" y="299" class="small" text-anchor="middle">temperatura, chuva, fumaça</text>
  <rect x="58" y="352" width="250" height="62" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="78" cy="372" r="13" fill="#b45309"/>
  <text x="78" y="377" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">C</text>
  <text x="183" y="380" class="label" text-anchor="middle">Território</text>
  <text x="183" y="404" class="small" text-anchor="middle">saneamento, renda, vulnerabilidade</text>
  <line x1="86" y1="344" x2="280" y2="344" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="183" y="342" class="tiny" text-anchor="middle">janela de defasagem</text>
  <path d="M308,164 C405,164 430,214 500,235" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)" />
  <path d="M308,280 C400,280 430,250 500,245" stroke="#0369a1" stroke-width="3" fill="none" marker-end="url(#arrow-teal)" />
  <path d="M308,383 C400,383 430,285 500,255" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow-teal)" />
  <rect x="500" y="188" width="255" height="130" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="627.5" y="216" class="label" text-anchor="middle">Integrar</text>
  <text x="627.5" y="240" class="small" text-anchor="middle">alinhamento no tempo</text>
  <text x="627.5" y="257" class="small" text-anchor="middle">alinhamento no espaço</text>
  <text x="627.5" y="274" class="mono" text-anchor="middle">sus_climate_aggregate</text>
  <path d="M755,253 L832,253" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
  <rect x="840" y="190" width="300" height="128" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  
  <text x="990" y="218" class="label" text-anchor="middle">Série integrada</text>
  <text x="990" y="242" class="small" text-anchor="middle">saúde + exposição climática</text>
  <text x="990" y="259" class="small" text-anchor="middle">+ indicador territorial</text>
  <text x="990" y="276" class="small" text-anchor="middle">base para modelagem causal</text>
  <rect x="820" y="350" width="320" height="54" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="840" y="374" class="section" >Atenção:</text>
  <text x="920" y="374" class="small" >correlação visual ainda não é prova causal.</text>
  <text x="840" y="395" class="tiny" >A Etapa Análise & Modelagem testa se o padrão é robusto.</text>
</svg>
