'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ETAPA 03</text><text x="630.7" y="212" font-size="16.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Modelagem</text><rect x="630.7" y="236" width="51.44" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="643.7" y="253.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">DLNM</text><rect x="630.7" y="276" width="159.56" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="643.7" y="293.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">defasagem distribuída</text><rect x="630.7" y="316" width="172.27999999999997" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="643.7" y="333.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">sazonalidade controlada</text><path d="M874.7,264.0 h10" stroke="#5b6b64" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" marker-end="url(#ar-muted)"/><rect x="892" y="158" width="260" height="212" rx="15" fill="#ffffff" stroke="#d8ded6" stroke-width="1.4" filter="url(#sh)"/><path d="M892,173 A15,15 0 0 1 907,158 L1137,158 A15,15 0 0 1 1152,173 L1152,162 L892,162 Z" fill="#0e7c6b"/><text x="912" y="184" font-size="9.2" fill="#0e7c6b" font-weight="700" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">ETAPA 04</text><text x="912" y="212" font-size="16.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Impacto</text><rect x="912" y="236" width="134.12" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="925" y="253.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">fração atribuível</text><rect x="912" y="276" width="134.12" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="925" y="293.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">número atribuível</text><rect x="912" y="316" width="159.56" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="925" y="333.5" font-size="10.6" fill="#0e7c6b" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">prioridade pediátrica</text><rect x="48" y="392" width="648" height="240" rx="15" fill="#ffffff" stroke="#d8ded6" stroke-width="1.4" filter="url(#sh)"/><path d="M48,407 A15,15 0 0 1 63,392 L681,392 A15,15 0 0 1 696,407 L696,396 L48,396 Z" fill="#0e7c6b"/><text x="70" y="422" font-size="14.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Por que a curva tem duas caudas</text><text x="70" y="440" font-size="11" fill="#5b6b64" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">risco relativo ao longo da temperatura, com mínimo de mortalidade (MMT)</text><text x="674" y="418" font-size="10" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">esquema</text><rect x="720" y="392" width="432" height="240" rx="15" fill="#ffffff" stroke="#d8ded6" stroke-width="1.4" filter="url(#sh)"/><path d="M720,407 A15,15 0 0 1 735,392 L1137,392 A15,15 0 0 1 1152,407 L1152,396 L720,396 Z" fill="#0e7c6b"/><text x="742" y="424" font-size="14.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Ficha do estudo</text><text x="1130" y="424" font-size="9.5" fill="#5b6b64" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end" font-style="italic">recorte analítico</text><text x="742" y="451" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Fonte</text><text x="856" y="451" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">SIM-DO</text><path d="M742,458 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="473" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">CID-10</text><text x="856" y="473" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">J00–J99</text><path d="M742,480 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="495" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">População</text><text x="856" y="495" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">&lt; 5 anos</text><path d="M742,502 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="517" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Território</text><text x="856" y="517" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Sudeste (SP, RJ, MG, ES)</text><path d="M742,524 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="539" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Período</text><text x="856" y="539" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">2015–2019</text><path d="M742,546 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="561" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Exposição</text><text x="856" y="561" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">temperatura + umidade</text><path d="M742,568 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="583" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Desenho</text><text x="856" y="583" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">DLNM</text><path d="M742,590 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="605" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Saída</text><text x="856" y="605" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">AF + número atribuível</text><rect x="32" y="676" width="1136" height="104" rx="16" fill="#0b2420" filter="url(#sh)"/><rect x="32" y="676" width="6" height="104" rx="3" fill="#2dd4bf"/><text x="48" y="704" font-size="10.5" fill="#2dd4bf" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" letter-spacing="2.2">LEITURA CIENTÍFICA</text><text x="48" y="728" font-size="14.5" fill="#e7f1ec" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">O recorte pediátrico torna explícita a vulnerabilidade biológica; a série semanal e a umidade reduzem confundimento.</text><text x="48" y="749" font-size="14.5" fill="#e7f1ec" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Fumaça e poluição entram como extensão: o desenho básico não as separa da temperatura.</text><path d="M102,557.0 H652" stroke="#d8ded6" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 4"/><text x="94" y="560.5" font-size="10" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">1.0<