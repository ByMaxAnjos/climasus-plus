  <title id="ttl">Respiratório pediátrico e temperatura</title>
  <desc id="dsc">Arco do caso ec-01: preparação no SIM-DO, integração com temperatura e umidade, modelagem DLNM e impacto atribuível em crianças menores de 5 anos. O gráfico mostra a curva em U do risco relativo por temperatura, com mínimo de mortalidade.</desc>
