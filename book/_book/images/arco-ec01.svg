6" y="592" font-size="9.5" fill="#b4472f" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end">calor</text><text x="377.0" y="592" font-size="10" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">temperatura do ar →</text><text x="70" y="616" font-size="10.6" fill="#5b6b64" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-style="italic">As duas caudas não são simétricas: o frio e o calor exigem limiares e alertas próprios.</text>
</svg>
