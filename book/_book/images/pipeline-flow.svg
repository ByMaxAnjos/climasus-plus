<svg viewBox="0 0 1400 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline de Preparação: da importação ao relatório de qualidade</title>
  <desc id="desc">Diagrama didático do livro ClimaSUS+ Studio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2420" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0e7c6b"/>
    </marker>
    <style>
      .title{font-size:29px;font-weight:800;fill:#0b2420}
      .subtitle{font-size:17px;fill:#5b6b64}
      .section{font-size:20px;font-weight:800;fill:#0b2420}
      .label{font-size:18px;font-weight:750;fill:#0b2420}
      .small{font-size:15px;fill:#5b6b64}
      .tiny{font-size:14px;fill:#5b6b64}
      .card{fill:#ffffff;stroke:#d8ded6;stroke-width:1.5;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1400" height="500" rx="18" fill="#f7f4ec"/>
  <text x="36" y="46" class="title">Etapa Preparação: dados de saúde prontos para análise</text>
  <text x="36" y="78" class="subtitle">Da importação DATASUS ao relatório de qualidade, cada Passo documenta uma decisão.</text>

  <rect x="32" y="118" width="1336" height="210" rx="20" fill="#0e7c6b" fill-opacity="0.09" stroke="#a7f3e4"/>

  <rect x="58" y="160" width="190" height="120" rx="14" fill="#ffffff" stroke="#0e7c6b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="82" cy="184" r="15" fill="#0e7c6b"/>
  <text x="82" y="190" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">1</text>
  <text x="153" y="220" class="label" text-anchor="middle">Importar</text>
  <text x="153" y="244" class="small" text-anchor="middle">DATASUS</text>
  <text x="153" y="266" class="small" text-anchor="middle">SIM/SINAN/SIH</text>

  <rect x="282" y="160" width="190" height="120" rx="14" fill="#ffffff" stroke="#0e7c6b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="306" cy="184" r="15" fill="#0e7c6b"/>
  <text x="306" y="190" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">2</text>
  <text x="377" y="220" class="label" text-anchor="middle">Padronizar</text>
  <text x="377" y="244" class="small" text-anchor="middle">encoding</text>
  <text x="377" y="266" class="small" text-anchor="middle">nomes e valores</text>

  <rect x="506" y="160" width="190" height="120" rx="14" fill="#ffffff" stroke="#0e7c6b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="530" cy="184" r="15" fill="#0e7c6b"/>
  <text x="530" y="190" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">3</text>
  <text x="601" y="220" class="label" text-anchor="middle">Filtrar CID</text>
  <text x="601" y="244" class="small" text-anchor="middle">grupo de doença</text>
  <text x="601" y="266" class="small" text-anchor="middle">ex.: respiratório</text>

  <rect x="730" y="160" width="190" height="120" rx="14" fill="#ffffff" stroke="#0e7c6b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="754" cy="184" r="15" fill="#0e7c6b"/>
  <text x="754" y="190" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">4</text>
  <text x="825" y="220" class="label" text-anchor="middle">Filtrar perfil</text>
  <text x="825" y="244" class="small" text-anchor="middle">idade, sexo</text>
  <text x="825" y="266" class="small" text-anchor="middle">território</text>

  <rect x="954" y="160" width="190" height="120" rx="14" fill="#ffffff" stroke="#0e7c6b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="978" cy="184" r="15" fill="#0e7c6b"/>
  <text x="978" y="190" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">5</text>
  <text x="1049" y="220" class="label" text-anchor="middle">Agregar</text>
  <text x="1049" y="244" class="small" text-anchor="middle">variáveis</text>
  <text x="1049" y="266" class="small" text-anchor="middle">série temporal</text>

  <rect x="1178" y="150" width="150" height="140" rx="14" fill="#ffffff" stroke="#0f4c47" stroke-width="2" filter="url(#shadow)"/>
  <text x="1253" y="200" class="label" text-anchor="middle">Qualidade</text>
  <text x="1253" y="226" class="small" text-anchor="middle">completude</text>
  <text x="1253" y="248" class="small" text-anchor="middle">consistência</text>
  <text x="1253" y="270" class="small" text-anchor="middle">relatório</text>

  <path d="M248,220 L278,220" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M472,220 L502,220" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M696,220 L726,220" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M920,220 L950,220" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <path d="M1144,220 L1174,220" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>

  <text x="60" y="368" class="section">Leitura científica:</text>
  <text x="60" y="398" class="small">a preparação reduz erro de codificação, explicita o recorte epidemiológico e registra a</text>
  <text x="60" y="420" class="small">qualidade da série antes da integração com clima.</text>
  <text x="60" y="452" class="small">Resultado esperado: série de saúde limpa, recortada e agregada, pronta para cruzamento</text>
  <text x="60" y="474" class="small">temporal e espacial.</text>
</svg>
