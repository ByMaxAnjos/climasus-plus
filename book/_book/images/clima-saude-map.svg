<svg viewBox="0 0 1430 598" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Da exposição climática ao desfecho de saúde, com defasagem</title>
  <desc id="desc">Diagrama didático do livro ClimaSUS+ Studio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b2420" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0e7c6b"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b5d52"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b2420"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:800;fill:#0b2420}
      .subtitle{font-size:15px;fill:#5b6b64}
      .section{font-size:17px;font-weight:800;fill:#0b2420}
      .label{font-size:15px;font-weight:750;fill:#0b2420}
      .small{font-size:13px;fill:#5b6b64}
      .tiny{font-size:11px;fill:#5b6b64}
      .mono{font-size:11px;fill:#0b5d52;font-family:"IBM Plex Mono","SF Mono",monospace}
      .card{fill:#ffffff;stroke:#d8ded6;stroke-width:1.5;filter:url(#shadow)}
      .note{fill:#efeade;stroke:#d8ded6;stroke-width:1}
    </style>
  </defs>
  <rect width="1430" height="598" rx="18" fill="#f7f4ec"/>
  <g transform="scale(1.3)">
  
<text x="32" y="42" class="title" >Clima e saúde: exposição, defasagem e vulnerabilidade</text>
  <text x="32" y="68" class="subtitle" >Ondas de calor, fumaça, chuvas e secas afetam a saúde com atraso e de forma desigual.</text>
  <line x1="105" y1="190" x2="975" y2="190" stroke="#0b2420" stroke-width="3"/>
  <text x="85" y="158" class="section" >t0</text>
  <text x="58" y="180" class="small" >exposição climática</text>
  <text x="900" y="158" class="section" >t0 + N dias</text>
  <text x="885" y="180" class="small" >desfecho de saúde</text>
  <g transform="translate(70 206)">
    <circle cx="40" cy="40" r="38" fill="#fff7ed" stroke="#9a6414" stroke-width="3"/>
    <rect x="31" y="18" width="10" height="31" rx="5" fill="none" stroke="#9a6414" stroke-width="3"/>
    <circle cx="36" cy="56" r="9" fill="#9a6414"/>
    <path d="M54,20 C64,35 66,43 56,52 C45,43 47,33 54,20Z" fill="#0b5d52"/>
    <text x="40" y="102" class="tiny" text-anchor="middle">calor, fumaça, chuva, seca</text>
  </g>
  <path d="M145,190 C310,150 650,150 900,190" stroke="#0e7c6b" stroke-width="3" fill="none" marker-end="url(#arrow-teal)" stroke-dasharray="8 8"/>
  <text x="525" y="95" class="section" text-anchor="middle" fill="#0f4c47">janela de exposição / lag</text>
  <text x="525" y="120" class="small" text-anchor="middle">o efeito pode aparecer dias ou semanas depois</text>
  <g transform="translate(895 206)">
    <circle cx="40" cy="40" r="38" fill="#fef2f2" stroke="#b4472f" stroke-width="3"/>
    <rect x="24" y="34" width="32" height="12" rx="2" fill="#b4472f"/>
    <rect x="34" y="24" width="12" height="32" rx="2" fill="#b4472f"/>
    <text x="40" y="102" class="tiny" text-anchor="middle">atendimento, internação, óbito</text>
  </g>
  <rect x="48" y="338" width="1004" height="108" rx="16" fill="#ecfeff" stroke="#bae6fd"/>
  <text x="76" y="364" class="section" >Vulnerabilidade modifica o risco:</text>
  <rect x="76" y="378" width="138" height="28" rx="14" fill="#0e7c6b" fill-opacity="0.14" stroke="#0e7c6b" stroke-width="1.4"/>
  <text x="88" y="397" class="tiny" >biológica: idade</text>
  <rect x="270" y="378" width="154" height="28" rx="14" fill="#9a6414" fill-opacity="0.14" stroke="#9a6414" stroke-width="1.4"/>
  <text x="282" y="397" class="tiny" >social: renda e acesso</text>
  <rect x="490" y="378" width="190" height="28" rx="14" fill="#b4472f" fill-opacity="0.14" stroke="#b4472f" stroke-width="1.4"/>
  <text x="502" y="397" class="tiny" >territorial: moradia e saneamento</text>
  <rect x="700" y="378" width="252" height="28" rx="14" fill="#0b5d52" fill-opacity="0.12" stroke="#0b5d52" stroke-width="1.4"/>
  <text x="712" y="397" class="tiny" >institucional: capacidade de resposta</text>
  <text x="76" y="430" class="small" >A mesma exposição pode produzir efeitos muito diferentes entre bairros e grupos populacionais.</text>
</g>
</svg>
