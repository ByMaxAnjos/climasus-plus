<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Do Pipeline validado ao artefato reprodutível</title>
  <desc id="desc">Diagrama didático do livro ClimaSUS+ Studio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:800;fill:#0f172a}
      .subtitle{font-size:15px;fill:#475569}
      .section{font-size:17px;font-weight:800;fill:#0f172a}
      .label{font-size:15px;font-weight:750;fill:#0f172a}
      .small{font-size:13px;fill:#475569}
      .tiny{font-size:11px;fill:#475569}
      .mono{font-size:11px;fill:#4338ca;font-family:"IBM Plex Mono","SF Mono",monospace}
      .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5;filter:url(#shadow)}
      .note{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#f8fafc"/>
<text x="32" y="42" class="title" >Etapa RAP: reprodutibilidade além da interface visual</text>
  <text x="32" y="68" class="subtitle" >O Pipeline validado vira artefato auditável, reexecutável e compartilhável.</text>
  <rect x="55" y="175" width="210" height="112" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="75" cy="195" r="13" fill="#0f766e"/>
  <text x="75" y="200" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">1</text>
  <text x="160" y="203" class="label" text-anchor="middle">Pipeline validado</text>
  <text x="160" y="227" class="small" text-anchor="middle">Passos + Parâmetros</text>
  <text x="160" y="244" class="small" text-anchor="middle">Resultados revisados</text>
  <path d="M265,231 L350,231" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
  <rect x="360" y="160" width="220" height="142" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="380" cy="180" r="13" fill="#4338ca"/>
  <text x="380" y="185" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">2</text>
  <text x="470" y="188" class="label" text-anchor="middle">Exportar</text>
  <text x="470" y="212" class="small" text-anchor="middle">artefato autocontido</text>
  <text x="470" y="229" class="mono" text-anchor="middle">sus_rap_export</text>
  <path d="M580,231 C645,160 700,118 780,110" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)" />
  <path d="M580,231 C650,231 700,231 780,231" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)" />
  <path d="M580,231 C645,300 700,342 780,352" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)" />
  <rect x="790" y="66" width="330" height="88" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="810" cy="86" r="13" fill="#0f766e"/>
  <text x="810" y="91" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">A</text>
  <text x="955" y="94" class="label" text-anchor="middle">Reexecutar</text>
  <text x="955" y="118" class="small" text-anchor="middle">reproduzir ou atualizar Resultados</text>
  <text x="955" y="135" class="mono" text-anchor="middle">sus_rap_read / sus_rap_run / sus_rap_update</text>
  <rect x="790" y="187" width="330" height="88" rx="14" fill="#ffffff" stroke="#0369a1" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="810" cy="207" r="13" fill="#0369a1"/>
  <text x="810" y="212" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">B</text>
  <text x="955" y="215" class="label" text-anchor="middle">Automatizar</text>
  <text x="955" y="239" class="small" text-anchor="middle">cache, paralelismo e reexecução seletiva</text>
  <text x="955" y="256" class="mono" text-anchor="middle">sus_rap_targets / sus_rap_make</text>
  <rect x="790" y="308" width="330" height="88" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="810" cy="328" r="13" fill="#b45309"/>
  <text x="810" y="333" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">C</text>
  <text x="955" y="336" class="label" text-anchor="middle">Compartilhar</text>
  <text x="955" y="360" class="small" text-anchor="middle">receita YAML ou projeto estruturado</text>
  <text x="955" y="377" class="mono" text-anchor="middle">sus_rap_recipe / sus_rap_template</text>
  <rect x="62" y="342" width="640" height="42" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="82" y="367" class="small" >RAP = Reprodutibilidade, Automação e Publicação: o caminho da análise auditável.</text>
</svg>
