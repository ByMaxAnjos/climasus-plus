  <title id="ttl">Idosos, cardiovascular e ondas de calor</title>
  <desc id="dsc">Arco do caso ec-03: preparação no SIM-DO para idosos, integração com ondas de calor de São Paulo, modelagem DLNM de efeito agudo e cálculo da carga atribuível. O gráfico mostra o pico de óbitos durante a onda de calor e o déficit posterior por efeito colheita.</desc>
