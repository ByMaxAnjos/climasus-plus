beration Mono', monospace">fração atribuível</text><rect x="912" y="276" width="134.12" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="925" y="293.5" font-size="10.6" fill="#b4472f" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">número atribuível</text><rect x="912" y="316" width="115.04" height="26" rx="13" fill="#efeade" stroke="none" stroke-width="1.4"/><text x="925" y="333.5" font-size="10.6" fill="#b4472f" font-weight="600" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">plano de calor</text><rect x="48" y="392" width="648" height="240" rx="15" fill="#ffffff" stroke="#d8ded6" stroke-width="1.4" filter="url(#sh)"/><path d="M48,407 A15,15 0 0 1 63,392 L681,392 A15,15 0 0 1 696,407 L696,396 L48,396 Z" fill="#b4472f"/><text x="70" y="422" font-size="14.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Um evento agudo, um pico e uma dívida</text><text x="70" y="440" font-size="11" fill="#5b6b64" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">óbitos diários em torno de uma onda de calor</text><text x="674" y="418" font-size="10" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="end">esquema</text><rect x="720" y="392" width="432" height="240" rx="15" fill="#ffffff" stroke="#d8ded6" stroke-width="1.4" filter="url(#sh)"/><path d="M720,407 A15,15 0 0 1 735,392 L1137,392 A15,15 0 0 1 1152,407 L1152,396 L720,396 Z" fill="#b4472f"/><text x="742" y="424" font-size="14.5" fill="#0b2420" font-weight="700" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Ficha do estudo</text><text x="1130" y="424" font-size="9.5" fill="#5b6b64" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="end" font-style="italic">recorte analítico</text><text x="742" y="451" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Fonte</text><text x="856" y="451" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">SIM-DO</text><path d="M742,458 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="473" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">CID-10</text><text x="856" y="473" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">capítulo I</text><path d="M742,480 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="495" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">População</text><text x="856" y="495" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">60 anos ou mais</text><path d="M742,502 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="517" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Território</text><text x="856" y="517" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">São Paulo (SP)</text><path d="M742,524 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="539" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Período</text><text x="856" y="539" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">2010–2019</text><path d="M742,546 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="561" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Exposição</text><text x="856" y="561" font-size="11.3" fill="#163b3