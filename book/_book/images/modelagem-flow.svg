<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Do DLNM à fração atribuível</title>
  <desc id="desc">Diagrama didático do livro ClimaSUS+ Studio.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4338ca"/>
    </marker>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f172a"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:800;fill:#0f172a}
      .subtitle{font-size:15px;fill:#475569}
      .section{font-size:17px;font-weight:800;fill:#0f172a}
      .label{font-size:15px;font-weight:750;fill:#0f172a}
      .small{font-size:13px;fill:#475569}
      .tiny{font-size:11px;fill:#475569}
      .mono{font-size:11px;fill:#4338ca;font-family:"IBM Plex Mono","SF Mono",monospace}
      .card{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.5;filter:url(#shadow)}
      .note{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="360" rx="18" fill="#f8fafc"/>
<text x="32" y="42" class="title" >Etapa Análise & Modelagem: do padrão visual à evidência</text>
  <text x="32" y="68" class="subtitle" >Modelos separam sazonalidade, tendência e ruído para estimar risco atribuível ao clima.</text>
  <rect x="50" y="140" width="220" height="110" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="70" cy="160" r="13" fill="#0f766e"/>
  <text x="70" y="165" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">1</text>
  <text x="160" y="168" class="label" text-anchor="middle">Entrada</text>
  <text x="160" y="192" class="small" text-anchor="middle">série integrada</text>
  <text x="160" y="209" class="small" text-anchor="middle">saúde + clima + território</text>
  <path d="M270,195 L350,195" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
  <rect x="360" y="120" width="250" height="150" rx="14" fill="#ffffff" stroke="#4338ca" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="380" cy="140" r="13" fill="#4338ca"/>
  <text x="380" y="145" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">2</text>
  <text x="485" y="148" class="label" text-anchor="middle">DLNM</text>
  <text x="485" y="172" class="small" text-anchor="middle">curva exposição-resposta</text>
  <text x="485" y="189" class="small" text-anchor="middle">estrutura de defasagem</text>
  <text x="485" y="206" class="mono" text-anchor="middle">sus_mod_dlnm</text>
  <polyline points="410,242 445,215 480,248 520,203 558,232" fill="none" stroke="#4338ca" stroke-width="3"/>
  <path d="M610,195 L700,195" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
  <rect x="710" y="120" width="235" height="150" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="730" cy="140" r="13" fill="#7c3aed"/>
  <text x="730" y="145" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">3</text>
  <text x="827.5" y="148" class="label" text-anchor="middle">Impacto</text>
  <text x="827.5" y="172" class="small" text-anchor="middle">fração atribuível</text>
  <text x="827.5" y="189" class="small" text-anchor="middle">número atribuível</text>
  <text x="827.5" y="206" class="mono" text-anchor="middle">sus_mod_af</text>
  <rect x="775" y="222" width="18" height="30" fill="#7c3aed" opacity="0.6"/>
  <rect x="805" y="198" width="18" height="54" fill="#7c3aed"/>
  <rect x="835" y="232" width="18" height="20" fill="#7c3aed" opacity="0.35"/>
  <path d="M945,195 L1015,195" stroke="#4338ca" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
  <rect x="1025" y="134" width="135" height="122" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1045" cy="154" r="13" fill="#15803d"/>
  <text x="1045" y="159" class="tiny" text-anchor="middle" fill="#fff" font-weight="800">4</text>
  <text x="1092.5" y="162" class="label" text-anchor="middle">Decisão</text>
  <text x="1092.5" y="186" class="small" text-anchor="middle">% e casos</text>
  <text x="1092.5" y="203" class="small" text-anchor="middle">atribuíveis</text>
  <text x="1092.5" y="220" class="small" text-anchor="middle">ao clima</text>
  <rect x="56" y="298" width="1088" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="600" y="321" class="small" text-anchor="middle">Mensagem científica: um gráfico integrado levanta hipótese; o Modelo estima incerteza e quantifica impacto.</text>
</svg>
