  <title id="ttl">RAP: do Pipeline validado ao artefato reprodutível</title>
  <desc id="dsc">Um Pipeline validado é exportado como projeto, código e resultados; o mesmo artefato permite reexecutar, automatizar e compartilhar a análise, dentro de uma cadeia de custódia que vai dos dados ao relatório.</desc>
