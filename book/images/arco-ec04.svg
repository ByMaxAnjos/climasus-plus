font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Fonte</text><text x="856" y="451" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">SIH-RD</text><path d="M742,458 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="473" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">CID-10</text><text x="856" y="473" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">J09–J18</text><path d="M742,480 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="495" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">População</text><text x="856" y="495" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">internações</text><path d="M742,502 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="517" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Território</text><text x="856" y="517" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Porto Alegre (RS)</text><path d="M742,524 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="539" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Período</text><text x="856" y="539" font-size="11.3" fill="#163b34" font-weight="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">2010–2019</text><path d="M742,546 H1130" stroke="#d8ded6" stroke-width="0.9"/><text x="742" y="561" font-size="10.4" fill="#5b6b64" font-weight="400" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace">Exposição</text><text x="856" y="561" font-size="11.3" fill="#16