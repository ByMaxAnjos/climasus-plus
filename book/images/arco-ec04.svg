  <title id="ttl">Hospitalizações respiratórias e frio</title>
  <desc id="dsc">Arco do caso ec-04: preparação no SIH-RD para pneumonias e influenza em Porto Alegre, integração com ondas de frio, modelo de série interrompida e tradução em contingência. O gráfico mostra a série observada, a tendência contrafactual e a mudança de nível após o evento.</desc>
